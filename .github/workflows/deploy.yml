name: Deploy (disabled)

# Automatic Jekyll build/deploy is intentionally DISABLED.
#
# The published site is now maintained directly on the `gh-pages` branch, which
# GitHub Pages serves. Rebuilding from this `master` Jekyll source would
# force-overwrite those hand-maintained changes, so auto-deploy is turned off.
#
# There are no push/pull_request triggers, and the job below is a no-op, so this
# workflow cannot overwrite `gh-pages` under any circumstance. To re-enable a
# source-based build, restore the al-folio deploy steps and add the
# push/pull_request triggers back to `on:`.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy disabled
        run: echo "Automatic deploy is disabled; the gh-pages branch is managed directly."
